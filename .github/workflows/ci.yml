name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, analyze & test
    runs-on: ubuntu-latest # Docker ja disponivel: necessario para Testcontainers
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RiskGuard.sln

      # Falha se QUALQUER pacote (inclusive transitivo) tiver vulnerabilidade conhecida. O NuGetAudit do build tambem barra.
      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list RiskGuard.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE '^\s+>' vulnerable.txt; then echo '::error::Pacotes vulneraveis encontrados'; exit 1; fi

      - name: Format & static analysis check
        run: dotnet format RiskGuard.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build RiskGuard.sln --no-restore --configuration Release

      - name: Test (unit + integration) with coverage
        run: >
          dotnet test RiskGuard.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --logger "trx;LogFileName=results.trx"

      # SDD 5.1: cobertura minima de 90% no RiskModule (unitarios + integracao mesclados). Reexecuta os testes.
      - name: Coverage gate (RiskModule >= 90%)
        shell: pwsh
        run: ./scripts/Test-RiskCoverage.ps1 -Threshold 90

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/**
          if-no-files-found: warn

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Falha com vulnerabilidade alta ou critica nas dependencias de producao.
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # valores de exemplo: o build nao os valida; os reais entram no deploy
          VITE_API_URL: https://api.example.test
          VITE_AUTH0_DOMAIN: example.us.auth0.com
          VITE_AUTH0_CLIENT_ID: ci
          VITE_AUTH0_AUDIENCE: https://api.example.test

  docker-dry-run:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O frontend e estatico (frontend/dist): o deploy e decisao em aberto (ver PRODUCT.md), por isso nao ha Dockerfile ainda.

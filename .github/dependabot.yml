version: 2
updates:
  # Uma dependencia por PR: facilita revisar o changelog e reverter (ver skill de code review).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Frontend: minor e patch juntos numa unica PR por semana; major continua em PR propria (revisao do changelog).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

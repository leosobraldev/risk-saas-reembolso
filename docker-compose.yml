# Infra local de desenvolvimento. Credenciais abaixo valem apenas para a maquina do desenvolvedor.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskguard
      POSTGRES_USER: riskguard
      POSTGRES_PASSWORD: riskguard_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskguard -d riskguard"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
